                    content:
                        "application/json":
                            schema:
                                additionalProperties: false
                                properties:
                                    data:
                                        additionalProperties: true
                                        properties: {}
                                        type: "object"
                                    user:
                                        properties:
                                            email:
                                                type: "string"
                                            emailVerified:
                                                type: "boolean"
                                            id:
                                                type: "string"
                                            image:
                                                type: "string"
                                            name:
                                                type: "string"
