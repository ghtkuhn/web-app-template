                                type: "object"
                    description: "Success"
                "400":
                    content:
                        "application/json":
                            schema:
                                properties:
                                    message:
                                        type: "string"
                                required:
                                    - "message"
                                type: "object"
                    description: "Bad Request. Usually due to missing parameters, or invalid parameters."
                "401":
                    content:
                        "application/json":
                            schema:
                                properties:
                                    message:
                                        type: "string"
                                required:
                                    - "message"
                                type: "object"
                    description: "Unauthorized. Due to missing or invalid authentication."
                "403":
                    content:
                        "application/json":
                            schema:
                                properties:
                                    message:
                                        type: "string"
                                type: "object"
                    description: "Forbidden. You do not have permission to access this resource or to perform this action."
                "404":
                    content:
                        "application/json":
                            schema:
                                properties:
                                    message:
                                        type: "string"
                                type: "object"
                    description: "Not Found. The requested resource was not found."
                "408":
                    content:
                        "application/json":
                            schema:
                                "$ref": "#/components/schemas/ErrorResponse"
                    description: "The request exceeded the configured processing deadline."
                "429":
                    content:
                        "application/json":
                            schema:
                                properties:
                                    message:
                                        type: "string"
                                type: "object"
                    description: "Too Many Requests. You have exceeded the rate limit. Try again later."
                "500":
                    content:
                        "application/json":
                            schema:
                                properties:
                                    message:
                                        type: "string"
                                type: "object"
                    description: "Internal Server Error. This is a problem with the server that you cannot fix."
            security:
                -
                    bearerAuth: []
            summary: "Get the account info provided by the provider"
            tags:
                - "Default"
