components:
    schemas:
        Account:
            properties:
                accessToken:
                    type: "string"
                accessTokenExpiresAt:
                    format: "date-time"
                    type: "string"
                accountId:
                    type: "string"
                createdAt:
                    format: "date-time"
                    type: "string"
                id:
                    readOnly: true
                    type: "string"
                idToken:
                    type: "string"
                password:
                    type: "string"
                providerId:
                    type: "string"
                refreshToken:
                    type: "string"
                refreshTokenExpiresAt:
                    format: "date-time"
                    type: "string"
                scope:
                    type: "string"
                updatedAt:
                    format: "date-time"
                    type: "string"
                userId:
                    type: "string"
            required:
                - "id"
                - "accountId"
                - "providerId"
                - "userId"
                - "createdAt"
                - "updatedAt"
            type: "object"
        ErrorResponse:
            additionalProperties: false
            properties:
                error:
                    type: "string"
                success:
                    const: false
                    type: "boolean"
            required:
                - "success"
                - "error"
            type: "object"
        HealthResponse:
            additionalProperties: false
            properties:
                data:
                    "$ref": "#/components/schemas/HealthStatus"
                success:
                    const: true
                    type: "boolean"
            required:
                - "success"
                - "data"
            type: "object"
        HealthStatus:
            additionalProperties: false
            properties:
                status:
                    const: "ok"
                    type: "string"
            required:
                - "status"
            type: "object"
        Session:
            properties:
                createdAt:
                    format: "date-time"
                    type: "string"
                expiresAt:
                    format: "date-time"
                    type: "string"
                id:
                    readOnly: true
                    type: "string"
                ipAddress:
                    type: "string"
                token:
                    type: "string"
                updatedAt:
                    format: "date-time"
                    type: "string"
                userAgent:
                    type: "string"
                userId:
                    type: "string"
            required:
                - "id"
                - "expiresAt"
                - "token"
                - "createdAt"
                - "updatedAt"
                - "userId"
            type: "object"
        User:
            properties:
                createdAt:
                    format: "date-time"
                    type: "string"
                email:
                    type: "string"
                emailVerified:
                    default: false
                    readOnly: true
                    type: "boolean"
                id:
                    readOnly: true
                    type: "string"
                image:
                    type: "string"
                name:
                    type: "string"
                updatedAt:
                    format: "date-time"
                    type: "string"
            required:
                - "id"
                - "name"
                - "email"
                - "emailVerified"
                - "createdAt"
                - "updatedAt"
            type: "object"
        Verification:
            properties:
                createdAt:
                    format: "date-time"
                    type: "string"
                expiresAt:
                    format: "date-time"
                    type: "string"
                id:
                    readOnly: true
                    type: "string"
                identifier:
                    type: "string"
                updatedAt:
                    format: "date-time"
                    type: "string"
                value:
                    type: "string"
            required:
                - "id"
                - "identifier"
                - "value"
                - "expiresAt"
                - "createdAt"
                - "updatedAt"
            type: "object"
    securitySchemes:
        apiKeyCookie:
            description: "API Key authentication via cookie"
            in: "cookie"
            name: "apiKeyCookie"
            type: "apiKey"
        bearerAuth:
            description: "Bearer token authentication"
            scheme: "bearer"
            type: "http"
